[versions]
# AvifKit library version — the single source of truth for BOTH :shared (avifkit) and
# :shared-native (avifkit-native), which must always ship as a matching pair (the Kotlin
# side calls the .so through a private JNI signature). In CI the publish workflow overrides
# it via the VERSION_NAME Gradle property derived from the release tag.
avifkit = "0.3.2"
agp = "9.2.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
# NDK r28c — compiles 16 KB-aligned shared libraries by default (Android 15+ / Google Play requirement)
android-ndk = "28.2.13676358"
androidx-activity = "1.11.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.9.5"
androidx-testExt = "1.3.0"
# Must match whatever the dependency graph actually resolves to, not merely what we would like.
# filekit-dialogs-compose 0.14.1 depends on Compose Multiplatform 1.10.3, so Gradle's conflict
# resolution raised every compose-* klib to 1.10.3 while this pin still drove the compiler plugin
# at 1.9.3. The iOS app compiled and linked, then died on its first frame:
#   IrLinkageError: Property accessor 'LocalSafeArea.<get-LocalSafeArea>' can not be called
# The Compose compiler plugin and the Compose runtime have to be the same release; naming the
# version the graph already chose is what keeps them together.
composeMultiplatform = "1.10.3"
datastore = "1.2.1"
# FileKit is pinned in one place: :shared publishes filekit-core as an api() dependency, so the
# app and the library must never drift onto different versions.
filekit = "0.14.1"
junit = "4.13.2"
# Never go below 2.2.21 — the first Kotlin/Native distribution built against the iOS 26 SDK.
# Under an older one the SDWebImage cinterop, generated from the installed Xcode 26 headers,
# references Metal 4 types that the bundled platform.Metal klib lacks, and commonizeCInterop
# dies on "Unresolved classifier: platform/Metal/MTL...".
kotlin = "2.3.21"
kotlinx-coroutines = "1.11.0"
mavenPublish = "0.36.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.9.1" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
# Pinned to 1.7.3 deliberately: JetBrains stopped publishing the Material icon artifacts after
# that release, so there is no 1.9.3 to match the rest of Compose. The icons themselves are just
# ImageVector data and do not depend on anything that moved.
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version = "1.7.3" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version = "0.26.0" }
