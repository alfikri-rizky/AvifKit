name: Publish iOS

# Release procedure (changed to avoid the tag force-move race, CODE_REVIEW.md L9):
# instead of pushing a tag first (which the workflow then had to force-MOVE onto the
# checksum commit — breaking any SPM resolve that happened in between), run this workflow
# manually with the target version. It builds from main, commits the checksum into
# Package.swift, then creates the tag ONCE on that commit and cuts the release. The tag
# never moves, so SPM always resolves a Package.swift whose checksum matches the asset.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.2 (no "v" prefix)'
        required: true

permissions:
  contents: write  # Required to create releases, push commits, and create the tag

jobs:
  publish-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # Full history for git operations

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradle.properties for CI
        run: |
          cat > gradle.properties << 'EOF'
          # CI/CD Build Configuration
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          kotlin.code.style=official
          kotlin.mpp.stability.nowarn=true
          kotlin.mpp.enableCInteropCommonization=true
          EOF

      - name: Setup Android libavif
        run: |
          # Remove orphaned gitlink directory so setup script does a fresh clone
          rm -rf shared-native/src/main/cpp/libavif
          chmod +x scripts/setup-android-libavif.sh
          ./scripts/setup-android-libavif.sh

      - name: Build iOS codec static libraries
        run: |
          # Builds libavif.a + libaom.a for iosArm64 / iosSimulatorArm64 / iosX64
          # from the same libavif source set up above. These are linked into the
          # Shared framework via cinterop linkerOpts (see shared/build.gradle.kts).
          chmod +x scripts/build-ios-libavif.sh
          ./scripts/build-ios-libavif.sh

      - name: Determine and validate version
        id: get_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"  # tolerate a stray leading "v"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected x.y.z"
            exit 1
          fi
          # Refuse to re-release an existing tag (would otherwise need a force-move again).
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists — bump the version"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build XCFramework
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --no-daemon --console=plain

      - name: Package XCFramework
        run: |
          chmod +x scripts/package-xcframework.sh
          ./scripts/package-xcframework.sh ${{ steps.get_version.outputs.VERSION }}

      - name: Calculate Checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum build/release/Shared.xcframework.zip)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "📦 Checksum: $CHECKSUM"

      - name: Update Package.swift with checksum
        run: |
          VERSION="v${{ steps.get_version.outputs.VERSION }}"
          CHECKSUM="${{ steps.checksum.outputs.CHECKSUM }}"

          # Already on main (checked out above). Replace any existing checksum with the real one.
          sed -i '' "s|checksum: \"[a-fA-F0-9]*\"|checksum: \"$CHECKSUM\"|" Package.swift
          sed -i '' "s|checksum: \"CHECKSUM_PLACEHOLDER_UPDATE_AFTER_BUILD\"|checksum: \"$CHECKSUM\"|" Package.swift

          # Ensure the URL points to the correct version
          sed -i '' "s|download/v[0-9]*\.[0-9]*\.[0-9]*/|download/$VERSION/|" Package.swift

          echo "✅ Updated Package.swift"
          echo "Checksum: $CHECKSUM"
          echo "Version: $VERSION"
          cat Package.swift | grep -A1 "checksum"

      - name: Commit Package.swift and create tag (once)
        run: |
          VERSION="v${{ steps.get_version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          # Commit the checksum (there is always a change: at minimum the download URL version).
          git commit -m "Update Package.swift checksum for release ${{ steps.get_version.outputs.VERSION }} [skip ci]"
          git push origin main

          # Create the tag ONCE, on the commit that already carries the correct checksum. No
          # force-move — the tag SPM resolves is immutable and always matches the released asset.
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "✅ Tagged $VERSION on the checksum commit"

      # Every release up to v0.3.2 shipped an identical hardcoded feature list, so the notes said
      # nothing about what actually changed. The per-version file is the highlights; the footer
      # below is the only part worth templating.
      - name: Compose release notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NOTES=".github/release-notes/${VERSION}.md"
          OUT="$RUNNER_TEMP/release-body.md"

          if [ -f "$NOTES" ]; then
            cat "$NOTES" > "$OUT"
          else
            echo "::warning::$NOTES not found — release will have no hand-written highlights."
            : > "$OUT"
          fi

          # Quoted delimiter: no expansion, so backticks and ``` survive verbatim.
          cat >> "$OUT" <<'TEMPLATE'

          ---

          <details>
          <summary><b>📦 Install</b></summary>

          **Gradle — Android / KMP**

          ```kotlin
          implementation("io.github.alfikri-rizky:avifkit:__VERSION__")
          ```

          **Swift Package Manager**

          ```swift
          .package(url: "https://github.com/alfikri-rizky/AvifKit.git", from: "__VERSION__")
          ```

          **CocoaPods**

          ```ruby
          pod 'AvifKit', '~> __VERSION__'
          ```

          </details>

          **`Shared.xcframework.zip` SHA-256** — `__CHECKSUM__`

          [Maven Central](https://central.sonatype.com/artifact/io.github.alfikri-rizky/avifkit/__VERSION__) · [README](https://github.com/alfikri-rizky/AvifKit/blob/main/README.md)
          TEMPLATE

          sed -i '' "s|__VERSION__|$VERSION|g" "$OUT"
          sed -i '' "s|__CHECKSUM__|${{ steps.checksum.outputs.CHECKSUM }}|g" "$OUT"
          echo "📝 Release body:"; cat "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # Explicit tag (workflow_dispatch has no tag ref); attaches to the tag created above.
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          files: build/release/Shared.xcframework.zip
          body_path: ${{ runner.temp }}/release-body.md
          # Appends GitHub's commit/PR list beneath the hand-written notes.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CocoaPods (Optional)
        if: ${{ vars.ENABLE_COCOAPODS_PUBLISH == 'true' }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          echo "📦 Publishing to CocoaPods..."
          pod trunk push AvifKit.podspec --allow-warnings

      - name: Build Summary
        run: |
          echo "### 🎉 iOS Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**XCFramework Size:** $(du -h build/release/Shared.xcframework.zip | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "**Checksum:** \`${{ steps.checksum.outputs.CHECKSUM }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Distribution" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Release created" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ XCFramework uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package.swift updated with checksum" >> $GITHUB_STEP_SUMMARY
          if [ "${{ vars.ENABLE_COCOAPODS_PUBLISH }}" == "true" ]; then
            echo "- ✅ CocoaPods published" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ CocoaPods publishing skipped (set ENABLE_COCOAPODS_PUBLISH variable to enable)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify GitHub release at: https://github.com/alfikri-rizky/AvifKit/releases/tag/v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Test SPM installation in an iOS project" >> $GITHUB_STEP_SUMMARY
          echo "3. Publish to Maven Central if not done yet" >> $GITHUB_STEP_SUMMARY
