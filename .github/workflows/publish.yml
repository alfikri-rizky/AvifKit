name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1)'
        required: true

jobs:
  publish:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install NDK r28
        run: |
          # Must match android-ndk in gradle/libs.versions.toml (16 KB page alignment).
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Setup Android libavif
        run: |
          # Remove orphaned gitlink directory so setup script does a fresh clone
          rm -rf shared-native/src/main/cpp/libavif
          chmod +x scripts/setup-android-libavif.sh
          ./scripts/setup-android-libavif.sh

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extract version from release tag (e.g., v0.2.3 → 0.2.3)
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Create gradle.properties for CI
        run: |
          cat > gradle.properties << 'EOF'
          # CI/CD Build Configuration
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          kotlin.code.style=official
          kotlin.mpp.stability.nowarn=true

          # Library Information - CRITICAL for Maven Central namespace
          GROUP=io.github.alfikri-rizky
          VERSION_NAME=${{ steps.version.outputs.VERSION }}
          POM_ARTIFACT_ID=avifkit

          # Maven Central Publishing (New Portal API)
          mavenCentralUsername=${{ secrets.MAVEN_CENTRAL_USERNAME }}
          mavenCentralPassword=${{ secrets.MAVEN_CENTRAL_PASSWORD }}

          # GPG Signing
          signingInMemoryKey=${{ secrets.SIGNING_IN_MEMORY_KEY }}
          signingInMemoryKeyPassword=${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          EOF

      - name: Build shared module
        run: ./gradlew :shared:build --no-daemon --stacktrace

      - name: Run tests
        # KMP aggregate test task (Android host + iOS simulator). The old :shared:test
        # task does not exist under the AGP 9 KMP library plugin.
        run: ./gradlew :shared:allTests --no-daemon --stacktrace

      - name: Publish to Maven Central
        run: |
          # Native companion artifact (avifkit-native) first, then the main library (avifkit),
          # whose Android variant references it transitively.
          ./gradlew :shared-native:publishToMavenCentral :shared:publishToMavenCentral \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache

      - name: Build Summary
        if: success()
        run: |
          echo "### ✅ Published to Maven Central!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:** \`io.github.alfikri-rizky:avifkit\` + \`io.github.alfikri-rizky:avifkit-native\` (native companion)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to https://central.sonatype.com/" >> $GITHUB_STEP_SUMMARY
          echo "2. Login with your credentials" >> $GITHUB_STEP_SUMMARY
          echo "3. Go to 'Deployments' section" >> $GITHUB_STEP_SUMMARY
          echo "4. Find your deployment and click 'Publish'" >> $GITHUB_STEP_SUMMARY
          echo "5. Wait ~15 minutes for Maven Central to sync" >> $GITHUB_STEP_SUMMARY
