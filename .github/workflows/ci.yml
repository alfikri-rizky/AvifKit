name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds both platforms and runs host + iOS simulator tests.
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK r28 and the SDK the app compiles against
        run: |
          # Must match android-ndk in gradle/libs.versions.toml (16 KB page alignment).
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "ndk;28.2.13676358"
          # android-app-compileSdk. AVIF Studio compiles against 37 because SimpleStorage 3.x
          # does; the published library still compiles against android-compileSdk (36).
          yes | "$SDKMANAGER" "platforms;android-37.0"

      - name: Cache libavif source
        uses: actions/cache@v4
        with:
          path: shared-native/src/main/cpp/libavif
          key: libavif-src-v1.4.2-${{ hashFiles('scripts/setup-android-libavif.sh') }}

      - name: Cache iOS codec static libs
        uses: actions/cache@v4
        with:
          path: shared/src/nativeInterop/libs/ios
          key: ios-libavif-v1.4.2-${{ hashFiles('scripts/build-ios-libavif.sh', 'scripts/setup-android-libavif.sh') }}

      - name: Setup Android libavif (skipped on cache hit)
        run: |
          # The setup script re-clones unconditionally in CI, which would defeat the cache.
          if [ ! -f shared-native/src/main/cpp/libavif/include/avif/avif.h ] || \
             [ ! -d shared-native/src/main/cpp/libavif/ext/aom ]; then
            chmod +x scripts/setup-android-libavif.sh
            ./scripts/setup-android-libavif.sh
          else
            echo "libavif source restored from cache"
          fi

      - name: Build iOS codec static libraries (skipped on cache hit)
        run: |
          if [ ! -f shared/src/nativeInterop/libs/ios/iosArm64/libavif.a ]; then
            chmod +x scripts/build-ios-libavif.sh
            ./scripts/build-ios-libavif.sh
          else
            echo "iOS static libs restored from cache"
          fi

      - name: Create gradle.properties for CI
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=false
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          kotlin.code.style=official
          kotlin.mpp.stability.nowarn=true
          kotlin.mpp.enableCInteropCommonization=true
          EOF

      - name: Check formatting
        run: ./gradlew :shared:ktfmtCheck :composeApp:ktfmtCheck :androidApp:ktfmtCheck --no-daemon

      - name: Build library
        # iosX64Test is excluded here and below: GitHub's arm64 macOS runners can't
        # launch x86_64 simulators reliably (the x64 klib/framework still builds).
        run: ./gradlew :shared:build -x :shared:iosX64Test --no-daemon --stacktrace

      - name: Build AVIF Studio (Android APK + iOS framework)
        # linkPod*, not link*: :composeApp declares CocoaPods dependencies (SDWebImageWebPCoder,
        # for WebP encoding), and the Kotlin CocoaPods plugin renames the framework binaries.
        run: |
          ./gradlew :androidApp:assembleDebug \
                    :composeApp:linkPodDebugFrameworkIosSimulatorArm64 \
                    :composeApp:linkPodDebugFrameworkIosArm64 \
                    --no-daemon --stacktrace

      - name: Run tests (host + iOS simulator)
        # The simulator device name must exist in the runner's Xcode — override with
        # -PiosSimulatorDevice if the runner image changes.
        run: |
          ./gradlew :shared:allTests :composeApp:allTests \
                    -x :shared:iosX64Test -x :composeApp:iosX64Test \
                    --no-daemon --stacktrace

      - name: Build the iOS app itself
        # Proves the Xcode project still links the Kotlin framework — a green Gradle build
        # says nothing about whether the app target compiles against it.
        #
        # `shell: bash` is load-bearing: it turns on pipefail. GitHub's implicit default is
        # `bash -e {0}` with no pipefail, so `xcodebuild ... | tail` would report tail's exit
        # status and this step could never fail.
        shell: bash
        run: |
          # The framework reaches Xcode through `pod 'composeApp'` now. Its podspec is generated
          # and git-ignored, so `podspec` has to run before `pod install` or CocoaPods aborts with
          # "No podspec found for `composeApp`"; generateDummyFramework only supplies the framework
          # the podspec points at.
          ./gradlew :composeApp:podspec :composeApp:generateDummyFramework --no-daemon
          (cd iosApp && pod install)
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep -Eo '\(([0-9A-F-]{36})\)' | tr -d '()' | head -1)
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            build | tail -40

  # Exercises the real JNI codec path (encode/decode/alpha/lossless/maxSize) on an emulator.
  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK r28
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Cache libavif source
        uses: actions/cache@v4
        with:
          path: shared-native/src/main/cpp/libavif
          key: libavif-src-v1.4.2-${{ hashFiles('scripts/setup-android-libavif.sh') }}

      - name: Setup Android libavif (skipped on cache hit)
        run: |
          if [ ! -f shared-native/src/main/cpp/libavif/include/avif/avif.h ] || \
             [ ! -d shared-native/src/main/cpp/libavif/ext/aom ]; then
            chmod +x scripts/setup-android-libavif.sh
            ./scripts/setup-android-libavif.sh
          else
            echo "libavif source restored from cache"
          fi

      - name: Create gradle.properties for CI
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.configureondemand=false
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          kotlin.code.style=official
          kotlin.mpp.stability.nowarn=true
          kotlin.mpp.enableCInteropCommonization=true
          EOF

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :shared:connectedAndroidDeviceTest --no-daemon --stacktrace
